const LOG_URL="https://script.google.com/macros/s/AKfycbyFeZy8WXYMRqrjsKfQM2C6Co5_l967arg7ZbxiKP6YTxxjbG4xR2QgkxRsGtiexa2M/exec";
const GROUP="nma";
const SK='course-cred:'+GROUP;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const enc=s=>new TextEncoder().encode(s);
const f=document.getElementById('f'),un=document.getElementById('un'),pw=document.getElementById('pw'),go=document.getElementById('go'),msg=document.getElementById('msg');
try{un.value=localStorage.getItem('course-user')||'';}catch(e){}
let auto=false;
if(GROUP){try{const c=JSON.parse(sessionStorage.getItem(SK)||'null');if(c&&c[0]&&c[1]){un.value=c[0];pw.value=c[1];auto=true;}}catch(e){}}
if(un.value)pw.focus();else un.focus();
if(!(window.crypto&&crypto.subtle)){msg.className='msg err';msg.textContent='当前浏览器不支持解密，请用最新版 Chrome、Edge、Safari 或 Firefox 通过 https 网址打开。';go.disabled=true;}
const hex=buf=>[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
function log(u,ok){
  if(!LOG_URL)return;
  const body=JSON.stringify({u,ok,p:document.title,ua:navigator.userAgent});
  try{fetch(LOG_URL,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain'},body}).catch(()=>{});}
  catch(e){try{navigator.sendBeacon(LOG_URL,new Blob([body],{type:'text/plain'}));}catch(_){}}
}
f.addEventListener('submit',async e=>{
  e.preventDefault();
  const user=un.value.trim().toUpperCase(); if(!user||!pw.value)return;
  go.disabled=true; msg.className='msg'; msg.textContent='正在验证…';
  try{
    const uid=hex(await crypto.subtle.digest('SHA-256',enc(user)));
    const rec=P.u[uid]; if(!rec)throw new Error('no user');

    const wk=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(rec.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const K=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(rec.i)},wk,b64(rec.w));
    const ck=await crypto.subtle.importKey('raw',K,'AES-GCM',false,['decrypt']);
    const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},ck,b64(P.c));
    const html=new TextDecoder().decode(buf);
    try{localStorage.setItem('course-user',user);}catch(e){}
    if(GROUP){try{sessionStorage.setItem(SK,JSON.stringify([user,pw.value]));}catch(e){}}
    log(user,true);
    document.open(); document.write(html); document.close();
