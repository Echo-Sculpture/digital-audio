<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>数字音频课程</title>
<style>
:root{--bg:#EDF0F2;--surface:#FFFFFF;--ink:#141D26;--muted:#566373;--line:#D0D8DF;--accent:#0A7580;
--sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;--serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0D1216;--surface:#151C22;--ink:#E4E9EE;--muted:#8D9AA8;--line:#2A3540;--accent:#36BCC6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.7}
main{max-width:760px;margin:0 auto;padding:56px 16px 80px}
.eb{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(30px,6vw,44px);margin:6px 0 8px;line-height:1.2}
p.lede{color:var(--muted);margin:0 0 32px}
ol{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
li a{display:grid;grid-template-columns:4.5em 1fr auto;gap:12px;align-items:baseline;padding:16px 4px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
li a:hover{background:var(--surface)}
.no{font-family:var(--mono);color:var(--accent);font-weight:600}
.t{font-weight:700;font-size:18px}
.t small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.lk{font-size:12px;color:var(--muted);white-space:nowrap}
footer{margin-top:28px;font-size:13px;color:var(--muted)}
</style>
</head><body>
<main>
  <div class="eb">Digital Audio</div>
  <h1>数字音频</h1>
  <p class="lede">课程交互式知识点页面。每一章都有可操作的图示和动画，并附复习区。</p>
  <ol>
    <li><a href="ch4.html"><span class="no">第四章</span><span class="t">音响的系统构成<small>话筒原理与指向性 · 录音系统与信号路由 · 近场监听与平衡传输 · 多声道环绕声 · 软件协议</small></span><span class="lk">需要密码</span></a></li>
  </ol>
  <footer>后续章节会陆续更新。页面密码请向任课教师索取。</footer>
</main>
</body></html>
